name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APKs
        run: >-
          ./gradlew --no-daemon
          -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED
          --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
          --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED
          --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED
          --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
          --add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED
          --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
          --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
          --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED'
          :3p-ecosystem:assembleDefaultDebug :3p-ecosystem:assembleTargetcommissionerDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: matter-android-debug-apks
          path: 3p-ecosystem/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: matter-android-debug-apks
          path: apks

      - name: Publish APKs on GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mapfile -t apk_files < <(find apks -type f -name '*.apk' -print)
          test "${#apk_files[@]}" -gt 0
          gh release create "$TAG_NAME" "${apk_files[@]}" --generate-notes
